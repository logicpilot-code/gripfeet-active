<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gripfeet — Mobile preview</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="styles.css" />
  <style>
    body { background: #0E0E0E; }

    @media print {
      @page {
        size: A4 landscape;
        margin: 8mm;
      }
      html, body {
        background: #0E0E0E !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        color-adjust: exact !important;
      }
      .mob-stage {
        min-height: auto !important;
        padding: 12mm 0 !important;
        background: #0E0E0E !important;
        page-break-inside: avoid;
        break-inside: avoid;
      }
      .mob-frames {
        gap: 24px !important;
        max-width: 100% !important;
        grid-template-columns: 1fr 1fr !important;
        display: grid !important;
      }
      .mob-frames > div {
        break-inside: avoid;
        page-break-inside: avoid;
      }
      /* The device frames already render correctly thanks to inline styles.
         Ensure their boxShadow and dark fills print. */
      .mob-stage * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      /* Hide the tweaks panel / any chrome that might mount */
      [class*="twk-"] { display: none !important; }
    }

    /* Banner shown while waiting for the print dialog */
    .print-banner {
      position: fixed; top: 0; left: 0; right: 0;
      z-index: 9999;
      background: #0A0A0A;
      color: #fff;
      padding: 10px 16px;
      font-family: ui-monospace, "SFMono-Regular", monospace;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    @media print { .print-banner { display: none !important; } }
  </style>
</head>
<body>
  <div class="print-banner">Gripfeet — preparing mobile preview for print… use Cmd/Ctrl+P if the dialog doesn't open.</div>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="mobile-app.jsx"></script>

  <script type="text/babel">
    // Auto-print: wait for fonts + both iframes loaded + a margin of time for
    // Babel to mount inside each iframe, then trigger.
    (async () => {
      try {
        if (document.fonts && document.fonts.ready) {
          await document.fonts.ready;
        }

        // Wait for both iframes to finish loading their HTML doc
        await new Promise((resolve) => {
          const wait = () => {
            const iframes = document.querySelectorAll("iframe");
            if (iframes.length < 2) return setTimeout(wait, 100);
            let ready = 0;
            const tick = () => { ready++; if (ready === iframes.length) resolve(); };
            iframes.forEach(f => {
              if (f.contentDocument?.readyState === "complete") tick();
              else f.addEventListener("load", tick, { once: true });
            });
          };
          wait();
        });

        // Generous buffer so inner Babel scripts have time to compile and mount
        await new Promise(r => setTimeout(r, 4500));

        const b = document.querySelector(".print-banner");
        if (b) b.style.display = "none";

        window.print();
      } catch (e) {
        console.warn("auto-print failed", e);
      }
    })();
  </script>
</body>
</html>
